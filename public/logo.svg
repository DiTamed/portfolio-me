<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 120 40"
  width="120"
  height="40"
  role="img"
  aria-label="NDT Developer Logo"
>
  <defs>
    <filter id="tealGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Left bracket -->
  <text
    x="25"
    y="21"
    font-family="monospace"
    font-size="25"
    font-weight="bold"
    fill="#0DB3B3"
    text-anchor="middle"
    dominant-baseline="middle"
    filter="url(#tealGlow)"
  >[</text>

  <!-- Initials -->
  <text
    x="60"
    y="21"
    font-family="Arial, Helvetica, sans-serif"
    font-size="21"
    font-weight="700"
    letter-spacing="0.5"
    fill="#FFFFFF"
    text-anchor="middle"
    dominant-baseline="middle"
  >NDT</text>

  <!-- Right bracket -->
  <text
    x="95"
    y="21"
    font-family="monospace"
    font-size="25"
    font-weight="bold"
    fill="#0DB3B3"
    text-anchor="middle"
    dominant-baseline="middle"
    filter="url(#tealGlow)"
  >]</text>
</svg>