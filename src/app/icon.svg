<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <!-- Neon background -->
    <radialGradient id="neonBg" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#123C3B"/>
      <stop offset="65%" stop-color="#252B2B"/>
      <stop offset="100%" stop-color="#252B2B"/>
    </radialGradient>

    <!-- Soft teal glow -->
    <filter id="neonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.5"/>
    </filter>
  </defs>

  <!-- Subtle neon glow -->
  <circle cx="50" cy="50" r="46"
          fill="#0DB3B3" opacity="0.18"
          filter="url(#neonGlow)"/>

  <!-- Main background -->
  <circle cx="50" cy="50" r="46" fill="url(#neonBg)"/>

  <!-- Left bracket -->
  <path d="M25 36 L18 36 L18 64 L25 64"
        fill="none" stroke="#0DB3B3"
        stroke-width="3" stroke-linecap="round"
        stroke-linejoin="round"/>

  <!-- Initials -->
  <text x="50" y="52"
        font-family="Arial, Helvetica, sans-serif"
        font-size="24" font-weight="700"
        letter-spacing="-1"
        text-anchor="middle"
        dominant-baseline="middle"
        fill="#FFFFFF">NDT</text>

  <!-- Right bracket -->
  <path d="M75 36 L82 36 L82 64 L75 64"
        fill="none" stroke="#0DB3B3"
        stroke-width="3" stroke-linecap="round"
        stroke-linejoin="round"/>
</svg>